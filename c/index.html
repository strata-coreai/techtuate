<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Save contact - techtuate</title>
  <meta name="description" content="A contact shared from a business card QR code. Tap to save it to your phone." />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="referrer" content="no-referrer" />
  <meta name="theme-color" content="#06050a" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ffd60a'/%3E%3Cpath d='M18 22 L32 14 L46 22 L46 42 L32 50 L18 42 Z' fill='none' stroke='%230a0a0a' stroke-width='4' stroke-linejoin='round'/%3E%3Ccircle cx='32' cy='32' r='4' fill='%230a0a0a'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/assets/flow.css" />
  <style>
    /* The contact lives only in the part of the link after "#", which browsers never send to a server. */
    html, body { background: #06050a; }
    body { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 28px 16px calc(28px + env(safe-area-inset-bottom)); margin: 0; }
    .cc { width: 100%; max-width: 420px; }
    .cc-card { position: relative; overflow: hidden; border-radius: 28px; padding: 28px 24px 24px; background: linear-gradient(160deg, rgba(255,255,255,.09), rgba(255,255,255,.035)); border: 1px solid rgba(255,255,255,.12); box-shadow: 0 30px 80px rgba(0,0,0,.45); }
    .cc-card::before { content: ""; position: absolute; inset: -40% -30% auto auto; width: 280px; height: 280px; border-radius: 50%; background: radial-gradient(closest-side, var(--acc, #ffd60a), transparent); opacity: .28; filter: blur(8px); pointer-events: none; }
    .cc-mono { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; font: 600 28px/1 'Bricolage Grotesque', system-ui, sans-serif; color: var(--on, #111); background: var(--acc, #ffd60a); margin-bottom: 18px; position: relative; }
    .cc-name { margin: 0; font: 600 clamp(28px, 8vw, 36px)/1.05 'Bricolage Grotesque', system-ui, sans-serif; letter-spacing: -.02em; color: #f4f2ee; overflow-wrap: anywhere; position: relative; }
    .cc-role { margin: 8px 0 0; font: 400 15px/1.45 'Geist', system-ui, sans-serif; color: rgba(244,242,238,.66); position: relative; }
    .cc-save { margin-top: 22px; width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 56px; border: 0; border-radius: 999px; background: #ffd60a; color: #111; font: 600 17px/1 'Geist', system-ui, sans-serif; cursor: pointer; position: relative; }
    .cc-save:active { transform: translateY(1px); }
    .cc-rows { list-style: none; margin: 20px 0 0; padding: 0; position: relative; }
    .cc-rows li { border-top: 1px solid rgba(255,255,255,.08); }
    .cc-rows a, .cc-rows span.v { display: flex; align-items: baseline; gap: 12px; padding: 13px 2px; color: #f4f2ee; text-decoration: none; font: 400 15px/1.35 'Geist', system-ui, sans-serif; overflow-wrap: anywhere; }
    .cc-rows small { flex: 0 0 64px; font: 400 10.5px/1.6 'Geist Mono', ui-monospace, monospace; letter-spacing: .12em; text-transform: uppercase; color: rgba(244,242,238,.45); }
    .cc-rows a:hover { color: #ffd60a; }
    .cc-foot { margin: 22px 4px 0; font: 400 12.5px/1.55 'Geist', system-ui, sans-serif; color: rgba(244,242,238,.5); text-align: center; }
    .cc-foot a { color: rgba(244,242,238,.8); }
    .cc-foot .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #ffd60a; box-shadow: 0 0 10px #ffd60a; margin-right: 6px; vertical-align: 1px; }
    .cc-err { text-align: center; color: #f4f2ee; font: 400 16px/1.5 'Geist', system-ui, sans-serif; }
    .cc-err h1 { font: 600 28px/1.1 'Bricolage Grotesque', system-ui, sans-serif; margin: 0 0 10px; }
    .cc-err a { color: #ffd60a; }
    .cc-toast { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px); opacity: 0; transition: .25s; background: #f4f2ee; color: #111; padding: 11px 18px; border-radius: 999px; font: 500 14px/1.3 'Geist', system-ui, sans-serif; max-width: calc(100% - 32px); text-align: center; }
    .cc-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <main class="cc" id="cc" aria-live="polite"></main>
  <div class="cc-toast" id="toast" role="status"></div>
  <noscript><p class="cc-err">This contact needs JavaScript to open.</p></noscript>
  <script src="./contact.js"></script>
</body>
</html>
